# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "check-version-consistency"
name = "Check version consistency (pyproject.toml vs version.py)"
language = "system"
pass_filenames = false
always_run = true
entry = '''
python -c "
import tomllib
pv = tomllib.load(open('pyproject.toml','rb'))['project']['version']

l = {}
exec(open('src/agent_as_unix_user/version.py').read(), l)
vv = l['__version__']

lk = tomllib.load(open('uv.lock','rb'))
lv = next(p['version'] for p in lk['package'] if p['name'] == 'agent-as-unix-user')

mismatches = []
if pv != vv:
    mismatches.append(f'pyproject.toml={pv!r} vs version.py={vv!r}')
if pv != lv:
    mismatches.append(f'pyproject.toml={pv!r} vs uv.lock={lv!r}')
if mismatches:
    raise SystemExit('Version mismatch: ' + ', '.join(mismatches))
"
'''

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run --only-dev ruff check --fix"
require_serial = true
pass_filenames = false
language = "system"
types_or = ["python", "pyi"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run --only-dev ruff format"
require_serial = true
language = "system"
types_or = ["python", "pyi"]

[[repos.hooks]]
id = "pyright"
name = "pyright"
entry = "uv run --only-dev pyright"
require_serial = true
language = "system"
types_or = ["python", "pyi"]
